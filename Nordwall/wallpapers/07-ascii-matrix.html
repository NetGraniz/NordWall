<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII / Matrix Rain</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background:
      radial-gradient(ellipse at 50% 46%, #092719 0%, #06140e 47%, #020805 100%);
      font-family: Consolas, 'Courier New', monospace; }
    main { text-align: center; width: 100%; }
    pre { margin: 0 auto; width: max-content; max-width: 100%;
      font-size: clamp(6px, .90vw, 15px); line-height: 1.16; letter-spacing: .13em;
      background: linear-gradient(180deg, #caffd5, #4bf19d 24%, #1dbb76 60%, #126544);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 4px #3beb794d); }
    h1 { margin: 24px 0 0; font-size: clamp(15px, 1.5vw, 25px);
      font-weight: 400; letter-spacing: .48em; color: #85efb0; }
  </style>
</head>
<body>
  <main>
    <pre id="scene" aria-label="Falling columns of ASCII code"></pre>
    <h1>ASCII / MATRIX RAIN</h1>
  </main>
  <script>
    'use strict';
    const scene = document.getElementById('scene');
    const cols = 99, rows = 39, frameCount = 120;
    const symbols = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&*+=:<>?';
    const frames = [];

    function hash(x, y) {
      let n = Math.imul(x + 103, 374761393) ^ Math.imul(y + 47, 668265263);
      n = Math.imul(n ^ (n >>> 13), 1274126177);
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    // Each drop starts and ends outside the visible area; every stream's
    // speed divides the 120-frame timeline, making the reset invisible.
    for (let frame = 0; frame < frameCount; frame++) {
      let picture = '';
      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          if (x % 3 === 2 || hash(x, 4) < .23) {
            picture += hash(x, y) > .992 ? '.' : ' ';
            continue;
          }
          const speed = 1 + (x % 3);
          const offset = Math.floor(hash(x, 6) * 120);
          const head = (frame * speed + offset) % 120 - 22;
          const trail = 8 + Math.floor(hash(x, 11) * 12);
          const distance = head - y;
          if (distance < 0 || distance > trail) {
            picture += hash(x, y + 100) > .993 ? '.' : ' ';
            continue;
          }
          if (distance === 0) {
            picture += '@';
          } else if (distance > trail * .84) {
            picture += hash(x, y) > .5 ? ':' : '.';
          } else if (distance > trail * .65) {
            picture += hash(x, y) > .5 ? '+' : '1';
          } else {
            picture += symbols[Math.floor(hash(x, y) * symbols.length)];
          }
        }
        picture += '\n';
      }
      frames.push(picture);
    }

    let index = 0;
    scene.textContent = frames[0];
    setInterval(() => {
      index = (index + 1) % frames.length;
      scene.textContent = frames[index];
    }, 85);
  </script>
</body>
</html>
