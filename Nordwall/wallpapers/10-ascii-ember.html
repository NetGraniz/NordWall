<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII / Ember</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background:
      radial-gradient(ellipse at 50% 75%, #3a1616 0%, #170d14 41%, #08080d 87%);
      font-family: Consolas, 'Courier New', monospace; }
    main { width: 100%; text-align: center; transform: translateY(-1vh); }
    pre { margin: 0 auto; width: max-content; max-width: 100%;
      font-size: clamp(6px, .93vw, 16px); line-height: 1.14; letter-spacing: .03em;
      background: linear-gradient(180deg, #ffe4a4 0%, #ffbc6a 37%, #ff7455 80%, #a93d48);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 5px #ff79362a); }
    h1 { margin: 22px 0 0; font-size: clamp(15px, 1.5vw, 25px);
      font-weight: 400; letter-spacing: .55em; color: #f3b99d; }
  </style>
</head>
<body>
  <main>
    <pre id="scene" aria-label="Animated ASCII flames and drifting embers"></pre>
    <h1>ASCII / EMBER</h1>
  </main>
  <script>
    'use strict';
    const scene = document.getElementById('scene');
    const cols = 99, rows = 39, frameCount = 120;
    const tau = Math.PI * 2;
    const shades = '   ..,:--==++**##%%@@';
    const frames = [];

    function hash(x, y) {
      const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return n - Math.floor(n);
    }

    for (let frame = 0; frame < frameCount; frame++) {
      const phase = frame * tau / frameCount;
      const pixels = Array.from({ length: rows }, () => Array(cols).fill(' '));

      for (let y = 0; y < rows; y++) {
        const v = y / (rows - 1);
        const rise = Math.max(0, Math.min(1, (.92 - v) / .79));
        const width = .235 * Math.pow(1 - rise, 1.13) + .013;
        const center = .5 + .044 * Math.sin(phase + rise * 5.7)
          + .021 * Math.cos(phase * 3 - rise * 8.1);
        for (let x = 0; x < cols; x++) {
          const u = x / (cols - 1);
          if (v > .93) {
            pixels[y][x] = Math.abs(u - .5) < .25 && hash(x, y) > .4 ? '_' : ' ';
            continue;
          }
          if (v < .12) continue;

          const displacement = (u - center) / width;
          const core = Math.exp(-displacement * displacement * 1.4);
          const turbulence = .80 + .17 * Math.sin(u * 27 + rise * 11 - phase * 2)
            + .11 * Math.cos(u * 39 - rise * 18 + phase * 3);
          const heat = Math.max(0, Math.min(.999,
            core * turbulence * (.98 - rise * .37)));
          if (heat > .075)
            pixels[y][x] = shades[Math.floor(heat * shades.length)];
        }
      }

      // Each spark is invisible at the beginning and end of its journey.
      // All speeds divide the timeline, so sparks wrap without a visible cut.
      for (let spark = 0; spark < 38; spark++) {
        const speed = 1 + spark % 3;
        const step = ((frame * speed + Math.floor(hash(spark, 1) * 120)) % 120) / 120;
        if (step < .065 || step > .91) continue;
        const u = .5 + (hash(spark, 3) - .5) * .59
          + .045 * Math.sin(phase * 2 + step * 8 + spark);
        const v = .88 - step * .78;
        const x = Math.round(u * (cols - 1));
        const y = Math.round(v * (rows - 1));
        if (x >= 0 && x < cols && y >= 0 && y < rows)
          pixels[y][x] = step < .76 ? '+' : '.';
      }

      frames.push(pixels.map(line => line.join('')).join('\n'));
    }

    let index = 0;
    scene.textContent = frames[0];
    setInterval(() => {
      index = (index + 1) % frames.length;
      scene.textContent = frames[index];
    }, 85);
  </script>
</body>
</html>
