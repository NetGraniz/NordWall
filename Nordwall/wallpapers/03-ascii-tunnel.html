<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII / Tunnel</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: grid; place-items: center; background:
      radial-gradient(ellipse at center, #16201a 0%, #080f0d 37%, #030706 76%);
      font-family: Consolas, 'Courier New', monospace; }
    main { width: 100%; text-align: center; }
    pre { margin: 0 auto; line-height: 1.07; letter-spacing: 0;
      font-size: clamp(6px, .92vw, 14px); font-weight: 600;
      background: linear-gradient(120deg, #367c67, #bbdf9c 50%, #4bbba1);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 21px 0 8px; color: #bcd7b9; font-size: clamp(15px, 1.6vw, 25px);
      font-weight: 400; letter-spacing: .55em; }
  </style>
</head>
<body>
  <main>
    <pre id="tunnel" aria-label="An endless moving tunnel made of ASCII characters"></pre>
    <h1>ASCII / TUNNEL</h1>
  </main>
  <script>
    'use strict';
    const output = document.getElementById('tunnel');
    const palette = '    ..::--==++**##%%@@';
    const frames = [];
    const cols = 95;
    const rows = 35;
    const frameCount = 96;

    // The tunnel motion uses only whole multiples of a full turn.
    for (let frame = 0; frame < frameCount; frame++) {
      const angle = Math.PI * 2 * frame / frameCount;
      let text = '';
      for (let y = 0; y < rows; y++) {
        let line = '';
        for (let x = 0; x < cols; x++) {
          const xx = (x - (cols - 1) / 2) / (cols * .47);
          const yy = (y - (rows - 1) / 2) / (rows * .45);
          const radius = Math.hypot(xx, yy);
          if (radius > 1.12) { line += ' '; continue; }

          const direction = Math.atan2(yy, xx);
          const rings = Math.pow(Math.max(0,
            Math.cos(17 * Math.log1p(radius * 3.8) - 2 * angle)), 7);
          const spokes = Math.pow(Math.max(0,
            Math.cos(12 * direction - angle)), 12);
          const edge = Math.min(1, radius * 5) * Math.max(0, 1 - radius * .34);
          const light = Math.min(.999, (rings * .72 + spokes * .25 + rings * spokes * .18) * edge);
          line += palette[Math.floor(light * palette.length)];
        }
        text += line + '\n';
      }
      frames.push(text);
    }

    let current = 0;
    output.textContent = frames[0];
    setInterval(() => {
      current = (current + 1) % frameCount;
      output.textContent = frames[current];
    }, 90);
  </script>
</body>
</html>
